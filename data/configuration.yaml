mqtt:
  host: "homeassistant.local"
  port: 1883
  user: "romain"
  password: "2121Rom1"
  topic: "Chauffage/bouilleur_dev"

device:
  id: "bouilleur_001"
  header:
    name: "poele_bouilleur"
    model: "KC-868-A6"
    description: "Poele bouilleur 17kw"
    room: "salon"

  displays:
    - id: "display_001"
      header:
        name: "ecran regulation bouilleur"
        model: "OLED-SSD1306"
        pin: 4
      datas:
        size: 
         x: 128 
         y: 64 
    - id: "serial_001"
      datas:
        bauds: 9600
        verbose: DEBUG
    - id: "remotelogs_001"
      datas:
        verbose: WARNING

  actuators:
    - id: "relay_001"
      header:
        name: "pompe bouilleur"
        model: "FIXED-SPEED-HYDRAULIC-PUMP"
        pin: 0
        description: "Relay 220v"
      datas:
        state: "on"
        mode: "MANUAL"
        diff_start: 9.0
        diff_stop: 5.0
        relay_delay: 180000

  sensors:
    - id: "sonde_001"
      header:
        name: "sonde depart bouilleur"
        model: "TEMPERATURE-SENSOR-DS18B20"
        pin: 33
        description: "DS18B20"
      datas:
        temperature: 0.0
        unit: "°C"
        max_temp: 90.0
        delay: 60000

    - id: "sonde_002"
      header:
        name: "sonde retour bouilleur"
        model: "TEMPERATURE-SENSOR-DS18B20"
        pin: 25
        description: "DS18B20"
      datas:
        temperature: 0.0
        unit: "°C"
        max_temp: 90.0
        delay: 60000
