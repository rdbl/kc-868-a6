SIMULATION_MODE: true

wifi:
  ssid: "Soulagnet_wifi"
  password: "piratepasmonwifi"

mqtt:
  host: "homeassistant.local"
  port: 1883
  user: "romain"
  password: "2121Rom1"
  topic: "Chauffage/bouilleur_dev"

ota:
  enabled: true
  port: 3232

device:
  id: "bouilleur_001"
  header:
    name: "poele_bouilleur"
    model: "KC-868-A6"
    description: "Poele bouilleur 17kw"
    room: "salon"
  hardware:
    i2c:
      sda: 26
      scl: 23
      pcf8574:
        address_hex: "0x24"
        num_relays: 6
        R1:
          pins: 
            first: 4
            last: 15

  displays:
    - id: "display_001"
      header:
        name: "ecran regulation bouilleur"
        model: "OLED-SSD1306"
      hardware:
        pins:
          COM: 4
      data:
        size:
          x: 128
          y: 64
    - id: "serial_001"
      data:
        bauds: 9600
        verbose: DEBUG
    - id: "remotelogs_001"
      data:
        verbose: WARNING

  actuators:
    - id: "relay_001"
      header:
        name: "pompe bouilleur"
        model: "FIXED-SPEED-HYDRAULIC-PUMP"
        description: "Relay 220v"

      hardware:
        i2c: "P0"

      data:
        state: "on"
        mode: "AUTO"
        diff_start: 6
        diff_stop: 5
        relay_delay_seconds: 180

  sensors:
    - id: "sonde_001"
      header:
        name: "sonde depart bouilleur"
        model: "TEMPERATURE-SENSOR-DS18B20"
        description: "DS18B20"
      hardware:

        pins:
          COM: 33
      data:
        temperature: 0.0
        unit: "°C"
        max_temp: 90.0
        delay_seconds: 60

    - id: "sonde_002"
      header:
        name: "sonde retour bouilleur"
        model: "TEMPERATURE-SENSOR-DS18B20"
        description: "DS18B20"

      hardware:
        pins:
          COM: 32
      data:
        temperature: 0.0
        unit: "°C"
        max_temp: 90.0
        delay_seconds: 60
